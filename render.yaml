services:
  - type: web
    name: finvault-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000"
      # Optional: Add OPENAI_API_KEY if utilizing AI Advisory live external LLM
      # - key: OPENAI_API_KEY
      #   sync: false
